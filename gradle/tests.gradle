// KhaosKorps fork: the test harness.
//
// - JUnit 5 in the standard `test` source set, for plain classes the fork adds.
// - Forge GameTests in their own `gametest` source set (src/gametest), kept out of the
//   release jar. They run headless with `gradlew runGameTestServer`, whose exit code is the
//   number of failed required tests, and in the dev client with `/test run <name>`.
//
// Kept in this one file so build.gradle carries a single `apply from:` line.

repositories {
    mavenCentral()
}

sourceSets {
    gametest {
        // Gradle's default folders for this name: src/gametest/java and src/gametest/resources.
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
    // corelib's API is a `shadow` dependency of the main code; its runtime jar comes through runtimeOnly.
    gametestCompileOnly.extendsFrom shadow
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
    // Under build/, so anything a test writes (Minecraft code opens logs/) stays out of the source tree.
    workingDir = project.file('build/junit-run')
    doFirst { workingDir.mkdirs() }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// Every GameTest run starts from a fresh world, so nothing an earlier run left behind (recruits,
// factions, groups) is loaded into it. Saved entities load after their chunk's blocks, so a
// leftover recruit would reappear inside a test arena the framework had already cleared.
// world/serverconfig is kept, so a run with UseAsyncPathfinding off is set up by editing
// world/serverconfig/recruits-server.toml before the run. The fork's own settings file goes too:
// a run that stops mid-batch would leave that batch's values in it, and Forge writes it afresh
// with the defaults.
//
// Forge's GameTest server is an ordinary dedicated server, so its world comes from
// server.properties, and the default is a normal world with monsters spawning. Test arenas sit
// near the bottom of the world, so in a normal world cave water and aquifers flood into them and
// cave monsters wander in. The run therefore uses a superflat world with no structures and no
// natural monster spawning. Difficulty stays as it is, so a test can still spawn a hostile mob on
// purpose.
def gameTestWorld = [
        'level-type'          : 'minecraft\\:flat',
        'generate-structures' : 'false',
        'spawn-monsters'      : 'false',
]
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    finalizedBy 'buildVisualizer'
    doFirst {
        project.delete(project.fileTree('build/gametest-run/world') { exclude 'serverconfig/**' })
        project.delete('build/gametest-run/world/serverconfig/recruits-khaoskorps-server.toml')
        // The visualiser shows one run: recordings from an earlier run, or from a test since removed, go.
        project.delete('build/gametest-run/runs', 'build/gametest-run/pathtrace')

        def properties = project.file('build/gametest-run/server.properties')
        def lines = properties.exists() ? properties.readLines() : []
        def missing = new LinkedHashMap(gameTestWorld)
        lines = lines.collect { line ->
            def key = line.contains('=') ? line.substring(0, line.indexOf('=')) : null
            if (key != null && missing.containsKey(key)) return key + '=' + missing.remove(key)
            return line
        }
        missing.each { key, value -> lines << (key + '=' + value) }
        properties.parentFile.mkdirs()
        properties.text = lines.join(System.lineSeparator()) + System.lineSeparator()
    }
}

minecraft {
    runs {
        client {
            mods { recruits { source sourceSets.gametest } }
        }
        server {
            mods { recruits { source sourceSets.gametest } }
        }
        gameTestServer {
            // Under build/, so it is git-ignored, `clean` removes it, and the dev world in run/ is untouched.
            workingDirectory project.file('build/gametest-run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', 'recruits'
            // The long group tests on the captured ravine (CapturedRavineGroupTests) run only when asked:
            // gradlew runGameTestServer -PgroupTests=pilot (or =all).
            property 'khaoskorps.groupTests', (project.findProperty('groupTests') ?: '').toString()
            // gradlew runGameTestServer -PgroupTests=all -PgroupDirtPath=OFF (or ONCE): the group runs' dirt-path setting.
            property 'khaoskorps.groupDirtPath', (project.findProperty('groupDirtPath') ?: '').toString()
            mods {
                recruits {
                    source sourceSets.main
                    source sourceSets.gametest
                }
            }
        }
    }
}

// The pathfinding visualiser (tools/visualizer/README.md): built from the last GameTest run's
// recordings and the source after every run, pass or fail, into build/visualizer. Needs Python 3 on
// the PATH. If it can't be built, the task says why and the test run's own result stands.
tasks.register('buildVisualizer', Exec) {
    group = 'verification'
    description = 'Builds the pathfinding visualiser page from the last GameTest run.'
    workingDir = project.projectDir
    commandLine 'python', '-I', 'tools/visualizer/build_visualizer.py',
            '--clone', project.projectDir.path,
            '--viz', 'tools/visualizer/viz.js',
            '--data', 'tools/visualizer/vizdata.js',
            '--out', 'build/visualizer/index.html',
            '--runs', 'build/gametest-run/runs',
            '--log', 'build/gametest-run/logs/latest.log'
    ignoreExitValue = true
    doLast {
        int exit = executionResult.get().exitValue
        if (exit != 0) {
            logger.warn("The pathfinding visualiser was not built: build_visualizer.py exited ${exit}; its message is above.")
        } else {
            logger.lifecycle("Pathfinding visualiser: ${project.file('build/visualizer/index.html')} (tools/visualizer/README.md says how to open it)")
        }
    }
    finalizedBy 'checkVisualizerData'
}

// The visualiser's data layer, tested on the run's own recordings (tools/visualizer/test_vizdata.js). Needs Node on the
// PATH; a failure is reported here and leaves the test run's result as it was.
tasks.register('checkVisualizerData', Exec) {
    group = 'verification'
    description = 'Tests the visualiser data layer and page on the recordings of the last GameTest run.'
    workingDir = project.projectDir
    commandLine 'node', 'tools/visualizer/test_vizdata.js', 'build/gametest-run/runs', 'build/visualizer'
    ignoreExitValue = true
    doLast {
        int exit = executionResult.get().exitValue
        if (exit != 0) logger.warn("The visualiser's data checks failed (node exited ${exit}); the failing checks are listed above.")
    }
}
